[loggers]
keys=root,pipeline

[handlers]
keys=consoleHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_pipeline]
level=INFO
handlers=consoleHandler
qualname=pipeline
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=defaultFormatter
args=(sys.stdout,)

[formatter_defaultFormatter]
format=%(asctime)s — %(levelname)s — %(name)s — %(message)s
datefmt=%Y-%m-%d %H:%M:%S