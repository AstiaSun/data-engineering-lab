[loggers]
keys=root,data_ingestor

[handlers]
keys=consoleHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_data_ingestor]
level=INFO
handlers=consoleHandler
qualname=data_ingestor
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=defaultFormatter
args=(sys.stdout,)

[formatter_defaultFormatter]
format=%(asctime)s — %(levelname)s — %(name)s — %(message)s
datefmt=%Y-%m-%d %H:%M:%S
