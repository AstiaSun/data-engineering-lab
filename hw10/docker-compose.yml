networks:
  wiki-streams-tier:
    driver: bridge

services:
  spark:
    image: bitnami/spark:3.5.5
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
    expose:
      - 8080
    networks:
      - wiki-streams-tier
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 5s
      timeout: 3s
      retries: 3

  spark-worker:
    image: bitnami/spark:3.5.5
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
    networks:
      - wiki-streams-tier
    ports:
      - "8081:8081"
    expose:
      - 8081
    depends_on:
      - spark

  kafka:
    image: bitnami/kafka:4.0.0
    networks:
      - wiki-streams-tier
    ports:
      - "9092:9092"
    expose:
      - 9092
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    healthcheck:
      test: kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1
      interval: 1s
      timeout: 60s
      retries: 60

  cassandra:
    image: bitnami/cassandra:5.0.4
    networks:
      - wiki-streams-tier
    ports:
      - "9042:9042"
    env_file: ".env"
    environment:
      - CASSANDRA_SEEDS=cassandra
      - CASSANDRA_CLUSTER_NAME=prod-cluster
      - CASSANDRA_PASSWORD_SEEDER=yes
      - CASSANDRA_NUM_TOKENS=256
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_ENABLE_USER_DEFINED_FUNCTIONS=false
      - JVM_EXTRA_OPTS=-Xms1G -Xmx2G -Dcassandra.consistent.rangemovement=false
    volumes:
      - .volumes/cassandra:/bitnami/cassandra
    healthcheck:
      test: [ "CMD", "cqlsh", "-u", "$CASSANDRA_USER", "-p", "$CASSANDRA_PASSWORD", "-e", "DESCRIBE KEYSPACES" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  pipeline:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    env_file: ".env"
    environment:
      - SPARK_MASTER_HOST=spark
      - KAFKA_HOST=kafka
      - CASSANDRA_HOST=cassandra
    networks:
      - wiki-streams-tier
    command: bash -c 'poetry run python -m src.hw10.data_ingestion'
    depends_on:
      spark:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
