services:
  database:
    image: mysql:9.3.0
    restart: always
    env_file: ".env"
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "3306:3306"
    expose:
      - "3306"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  data-loader:
    env_file: ".env"
    environment:
      - DATASET_PATH=/data-engineering-lab/dataset
      - MYSQL_HOST=database
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ./dataset:/data-engineering-lab/dataset:ro
    command: bash -c "poetry run alembic upgrade head && poetry run python -m src.main"
    depends_on:
      database:
        condition: service_healthy
